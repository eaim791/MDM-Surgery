# Netlify: build del sitio + funciones del editor (login y publicar).
# Las funciones quedan en /api/... gracias al redirect de abajo.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Headers de seguridad. El CSP solo permite los orígenes que el sitio usa de
# verdad: Formspree (formulario de contacto) y jsDelivr (heic2any, cargado
# bajo demanda solo dentro del editor). Nada de terceros de más — no hay
# analytics, pixels ni embeds. Revisar la consola tras el próximo deploy por
# si algún origen quedó afuera. Ver docs/MDM_SURGERY_MASTER_AUDIT.md.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; font-src 'self'; connect-src 'self' https://formspree.io; form-action 'self' https://formspree.io; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
